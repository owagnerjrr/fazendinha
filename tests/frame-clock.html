<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Controle de requestAnimationFrame sem jogo</title><body><h1>Controle de quadros do navegador</h1><p>Sem Phaser, mapa, sprites ou efeitos. Apenas requestAnimationFrame e o mesmo medidor.</p><output id="rate">Medindo…</output><script type="module">import {FrameBudget} from '/src/frame-budget.ts';const budget=new FrameBudget();function frame(){if(budget.tick(performance.now(),!document.hidden))document.getElementById('rate').textContent=`${budget.fps.toFixed(1)} FPS · p95 ${budget.p95.toFixed(1)} ms`;requestAnimationFrame(frame);}document.addEventListener('visibilitychange',()=>budget.reset());requestAnimationFrame(frame);</script></body></html>
